name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: equal_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      UV_PYTHON: "3.12"
      COMMERCE_MODE: demo
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/equal_ai
      TEST_DATABASE_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      REQUIRE_INTEGRATION_DB: "1"
      APP_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      OPENAI_API_KEY: ""
      CLERK_SECRET_KEY: sk_test_not-a-real-key
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_replace_me
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      CLERK_AUTHORIZED_PARTIES_CSV: http://localhost:3003,http://127.0.0.1:3003
      FRONTEND_URL: http://localhost:3003
      CORS_ORIGINS: http://localhost:3003,http://127.0.0.1:3003

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: Verify
        run: make check-full
