[pytest]
pythonpath = .
cache_dir = .pytest_cache
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
markers =
    live: opt-in real-provider smoke test (needs --run-live and GHARSAATHI_LIVE_SMOKE=1)
    live_cart: live smoke test that mutates the provider cart (also needs GHARSAATHI_LIVE_SMOKE_CART=1)
