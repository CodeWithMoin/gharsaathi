[pytest]
pythonpath = .
cache_dir = .pytest_cache
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
addopts = --strict-markers
markers =
    unit: one function or class; no I/O, database or network (tests/unit/)
    module: one backend module through its public interface with in-memory fakes (tests/module/)
    integration: real FastAPI app + a throwaway PostgreSQL database; providers are fakes (tests/integration/)
